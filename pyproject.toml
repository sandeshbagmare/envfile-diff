[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envfile-diff"
version = "0.1.0"
description = "Diff two .env files by key, masking values by default"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["dotenv", "env", "config", "diff", "secrets", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
envfile-diff = "envfile_diff.__main__:main"

[project.urls]
Homepage = "https://github.com/sandeshbagmare/envfile-diff"
Issues = "https://github.com/sandeshbagmare/envfile-diff/issues"
Changelog = "https://github.com/sandeshbagmare/envfile-diff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/envfile_diff"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
